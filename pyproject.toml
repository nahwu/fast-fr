[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fast-fr"
version = "0.1.0"
description = "Offline-first exam gantry facial-recognition system"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "onnxruntime-gpu>=1.20,<2; platform_system == 'Windows'",
  "opencv-python-headless>=4.10,<5",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
fast-fr = "fastfr.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/fastfr"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

